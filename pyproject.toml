# setuptools 77 reads the SPDX license string below
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# On PyPI as raindrop-viewer, since raindrop is another project's name there; the command and the import package are
# both raindrop
name = "raindrop-viewer"
dynamic = ["version"]
description = "Raindrop, a browser viewer for single-cell and spatial data, with its converter"
readme = "README.md"
requires-python = ">=3.10"
# Raindrop is LGPL; the three.js files it ships in viewer/vendor/ are MIT, with their notice in THREE_LICENSE
license = "LGPL-3.0-or-later AND MIT"
license-files = ["LICENSE", "viewer/vendor/THREE_LICENSE"]
authors = [{name = "Ning Wang"}]
dependencies = ["anndata>=0.10", "numpy", "pandas", "platformdirs", "scipy"]
keywords = ["single-cell", "spatial transcriptomics", "anndata", "h5ad", "visualization", "point cloud", "viewer",
            "three.js"]
# No "License ::" classifier: setuptools 77 refuses one next to the SPDX license expression above (PEP 639)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/NingWang1729/raindrop"
Repository = "https://github.com/NingWang1729/raindrop"
Issues = "https://github.com/NingWang1729/raindrop/issues"
Changelog = "https://github.com/NingWang1729/raindrop/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# The packaging tests build a wheel with setuptools
test = ["pytest", "setuptools>=77"]

[project.scripts]
raindrop = "raindrop.cli:main"

# The converter (raindrop.convert) and the raindrop command are one small package; tests/ and data/ are not Python
# packages, and the clone's convert.py only runs raindrop.convert, so it is not installed.
# The viewer stays in viewer/ at the repository root; the raindrop.viewer entries copy it into the package as
# raindrop/viewer, for raindrop view (a new folder in viewer/ needs its own entry in both lists)
[tool.setuptools]
packages = ["raindrop", "raindrop.viewer", "raindrop.viewer.js", "raindrop.viewer.vendor"]

[tool.setuptools.package-dir]
"raindrop.viewer" = "viewer"

[tool.setuptools.package-data]
"raindrop.viewer" = ["*.html", "*.css", "*.json"]
"raindrop.viewer.js" = ["*.js"]
"raindrop.viewer.vendor" = ["*"]

# One version number, in the package (the cache of raindrop view depends on it)
[tool.setuptools.dynamic]
version = {attr = "raindrop.__version__"}
